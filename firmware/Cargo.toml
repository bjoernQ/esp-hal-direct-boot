[package]
name = "direct-boot-hello"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "direct-boot-hello"
test = false
bench = false

[dependencies]
# All three must use the same esp-hal revision.
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "286a7e86a9ce88411a45fb9cd0b28dd431960d01", features = [
  "panic-handler",
  "println",
] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "286a7e86a9ce88411a45fb9cd0b28dd431960d01", features = [
  "log-04",
  "unstable",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "286a7e86a9ce88411a45fb9cd0b28dd431960d01", features = [
  "log-04",
] }

[features]
# Print the memory protection state the ROM leaves behind (RISC-V) and progress markers around
# `esp_hal::init`, through the ROM.
boot-trace = []
esp32c2 = ["esp-backtrace/esp32c2", "esp-hal/esp32c2", "esp-println/esp32c2"]
esp32c3 = ["esp-backtrace/esp32c3", "esp-hal/esp32c3", "esp-println/esp32c3"]
esp32c5 = ["esp-backtrace/esp32c5", "esp-hal/esp32c5", "esp-println/esp32c5"]
esp32c6 = ["esp-backtrace/esp32c6", "esp-hal/esp32c6", "esp-println/esp32c6"]
esp32c61 = ["esp-backtrace/esp32c61", "esp-hal/esp32c61", "esp-println/esp32c61"]
esp32h2 = ["esp-backtrace/esp32h2", "esp-hal/esp32h2", "esp-println/esp32h2"]
esp32h4 = ["esp-backtrace/esp32h4", "esp-hal/esp32h4", "esp-println/esp32h4"]
esp32p4 = ["esp-backtrace/esp32p4", "esp-hal/esp32p4", "esp-println/esp32p4"]
esp32s3 = ["esp-backtrace/esp32s3", "esp-hal/esp32s3", "esp-println/esp32s3"]
esp32s31 = ["esp-backtrace/esp32s31", "esp-hal/esp32s31", "esp-println/esp32s31"]

[profile.dev]
opt-level = "s"

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
